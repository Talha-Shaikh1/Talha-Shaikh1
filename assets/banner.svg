<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="Talha Shaikh, solo founder and AI full-stack engineer. A Hinglish customer chat answered by a RAG bot." xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#03110d"/>
      <stop offset="1" stop-color="#07261e"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#10b981" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#10b981" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="botbubble" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#34d399"/>
      <stop offset="1" stop-color="#14b8a6"/>
    </linearGradient>
  </defs>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif; }
    .in  { animation: rise .6s ease-out backwards; }
    .u   { animation-delay: .3s; }
    .c1  { animation-delay: 1.3s; }
    .c2  { animation-delay: 1.6s; }
    .bot { animation-delay: 3.3s; }
    .typing { opacity: 0; animation: typing 1.4s linear 1.9s both; }
    .dot { transform-box: fill-box; transform-origin: center; animation: pulse .9s ease-in-out infinite; }
    .d2 { animation-delay: .15s; }
    .d3 { animation-delay: .3s; }
    @keyframes rise { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
    @keyframes typing { 0% { opacity: 0; } 8% { opacity: 1; } 92% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pulse { 0%, 100% { transform: scale(.7); opacity: .5; } 50% { transform: scale(1.1); opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .in, .typing, .dot { animation: none !important; } .typing { opacity: 0; } }
  </style>

  <rect width="1280" height="360" fill="url(#bg)"/>
  <circle cx="960" cy="190" r="380" fill="url(#glow)"/>

  <!-- identity -->
  <text x="72" y="176" font-size="78" font-weight="800" fill="#ecfdf5" letter-spacing="-2.5">Talha Shaikh</text>
  <text x="76" y="228" font-size="25" font-weight="600" fill="#6ee7b7">Solo founder. AI and full-stack engineer.</text>
  <text x="76" y="268" font-size="20" fill="#8fb8aa">I build Botaura: RAG chatbots for Pakistani SMBs.</text>
  <text x="76" y="302" font-size="18" fill="#5d8a7c">Karachi, Pakistan</text>

  <!-- the conversation -->
  <g class="in u">
    <rect x="830" y="62" width="380" height="58" rx="20" fill="#0f3a30"/>
    <text x="854" y="98" font-size="21" fill="#d1fae5">Bhai, mera order kab tak aayega?</text>
  </g>

  <g class="in c1">
    <rect x="700" y="146" width="168" height="32" rx="16" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="722" y="168" font-size="15" fill="#5eead4">orders.pdf  0.91</text>
  </g>
  <g class="in c2">
    <rect x="880" y="146" width="208" height="32" rx="16" fill="none" stroke="#14b8a6" stroke-width="1.5"/>
    <text x="902" y="168" font-size="15" fill="#5eead4">shipping-policy  0.87</text>
  </g>

  <g class="typing">
    <rect x="700" y="204" width="88" height="46" rx="23" fill="#0f3a30"/>
    <circle class="dot" cx="729" cy="227" r="5.5" fill="#5eead4"/>
    <circle class="dot d2" cx="744" cy="227" r="5.5" fill="#5eead4"/>
    <circle class="dot d3" cx="759" cy="227" r="5.5" fill="#5eead4"/>
  </g>

  <g class="in bot">
    <rect x="700" y="204" width="500" height="104" rx="22" fill="url(#botbubble)"/>
    <text x="726" y="248" font-size="22" font-weight="700" fill="#03110d">Aapka order kal tak pohanch jayega.</text>
    <text x="726" y="282" font-size="20" font-weight="500" fill="#06352a">Tracking link WhatsApp par bhej diya hai.</text>
  </g>

  <text x="1208" y="342" font-size="16" fill="#3f7566" text-anchor="end">botaura.app</text>
</svg>
