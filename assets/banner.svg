<svg
  xmlns="http://www.w3.org/2000/svg"
  viewBox="0 0 1600 700"
  width="1600"
  height="700"
  role="img"
  aria-label="Talha Shaikh — Solo founder, AI and full-stack engineer. Building Botaura RAG chatbots for Pakistani SMBs."
>

<defs>

  <!-- BACKGROUND -->
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#020b09"/>
    <stop offset="48%" stop-color="#031814"/>
    <stop offset="100%" stop-color="#06291f"/>
  </linearGradient>

  <radialGradient id="mainGlow" cx="72%" cy="45%" r="55%">
    <stop offset="0%" stop-color="#10b981" stop-opacity=".20"/>
    <stop offset="45%" stop-color="#10b981" stop-opacity=".07"/>
    <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
  </radialGradient>

  <radialGradient id="greenGlow" cx="50%" cy="50%" r="50%">
    <stop offset="0%" stop-color="#34d399" stop-opacity=".35"/>
    <stop offset="100%" stop-color="#34d399" stop-opacity="0"/>
  </radialGradient>

  <!-- GLASS -->
  <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#163c34" stop-opacity=".72"/>
    <stop offset="100%" stop-color="#061b16" stop-opacity=".48"/>
  </linearGradient>

  <!-- BOT -->
  <linearGradient id="bot" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#6ee7b7"/>
    <stop offset="50%" stop-color="#34d399"/>
    <stop offset="100%" stop-color="#14b8a6"/>
  </linearGradient>

  <!-- STACK -->
  <linearGradient id="layerTop" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#173f35"/>
    <stop offset="100%" stop-color="#071b16"/>
  </linearGradient>

  <linearGradient id="layerGreen" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#34d399"/>
    <stop offset="100%" stop-color="#059669"/>
  </linearGradient>

  <linearGradient id="layerBlue" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#38bdf8"/>
    <stop offset="100%" stop-color="#0369a1"/>
  </linearGradient>

  <!-- LOGO GRADIENT -->
  <linearGradient id="logoGrad" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#5eead4"/>
    <stop offset="100%" stop-color="#34d399"/>
  </linearGradient>

  <!-- GLOWS -->
  <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="10" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow" x="-100%" y="-100%" width="300%" height="300%">
    <feGaussianBlur stdDeviation="22"/>
  </filter>

  <clipPath id="bottomClip">
    <rect x="0" y="570" width="1600" height="130"/>
  </clipPath>

</defs>


<style>

  text {
    font-family:
      Inter,
      "Segoe UI",
      system-ui,
      -apple-system,
      BlinkMacSystemFont,
      Arial,
      sans-serif;
  }

  .title {
    font-weight: 850;
    letter-spacing: -3.8px;
  }

  .fade {
    animation: fadeIn .8s ease-out both;
  }

  .delay1 { animation-delay: .15s; }
  .delay2 { animation-delay: .3s; }
  .delay3 { animation-delay: .45s; }
  .delay4 { animation-delay: .6s; }
  .delay5 { animation-delay: .75s; }

  .pulse {
    animation: pulse 2.5s ease-in-out infinite;
  }

  .dash {
    stroke-dasharray: 6 9;
    animation: dash 1.5s linear infinite;
  }

  .wave {
    animation: wave 7s ease-in-out infinite alternate;
  }

  @keyframes fadeIn {
    from {
      opacity: 0;
      transform: translateY(18px);
    }
    to {
      opacity: 1;
      transform: translateY(0);
    }
  }

  @keyframes pulse {
    0%,100% { opacity: .35; }
    50% { opacity: .8; }
  }

  @keyframes dash {
    to { stroke-dashoffset: -30; }
  }

  @keyframes wave {
    from { transform: translateX(-15px); }
    to { transform: translateX(15px); }
  }

  @media (prefers-reduced-motion: reduce) {
    * {
      animation: none !important;
    }
  }

</style>


